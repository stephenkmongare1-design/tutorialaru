services:
  - type: web
    name: tutorai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: DATABASE_URL
        value: sqlite:///tutorai.db
      - key: ADMIN_EMAIL
        value: admin@tutorai.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRICE_STANDARD
        value: "1200"
      - key: PRICE_NATIONAL
        value: "3000"
      - key: PRICE_INTERNATIONAL
        value: "6000"
      - key: TEACHER_LICENSE_FEE
        value: "1500"
      - key: TEACHER_LICENSE_YEARS
        value: "3"
