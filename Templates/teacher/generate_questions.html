{% extends "base.html" %}
{% block title %}Generate Questions{% endblock %}
{% block page_title %}Generate questions with AI{% endblock %}
{% block page_subtitle %}For: {{ a.title }}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:600px;">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">Topic</label>
      <input class="form-control" name="topic" required placeholder="e.g. Simple interest, Photosynthesis">
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Number of questions</label>
        <input type="number" class="form-control" name="count" value="5" min="1" max="20">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Question type</label>
        <select class="form-select" name="qtype">
          <option value="mcq">Multiple choice</option>
          <option value="short_answer">Short answer</option>
        </select>
      </div>
    </div>
    <button class="btn btn-brand" type="submit"><i class="bi bi-stars me-1"></i> Generate</button>
    <a href="{{ url_for('teacher.assignment_detail', aid=a.id) }}" class="btn btn-outline-brand">Cancel</a>
  </form>
</div>
{% endblock %}
