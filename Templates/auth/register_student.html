{% extends "auth/_auth_base.html" %}
{% block title %}Student sign up{% endblock %}
{% block content %}
<div class="step-dots"><span class="active"></span><span></span><span></span><span></span></div>
<h4 class="fw-bold text-center mb-1">Create your student account</h4>
<p class="text-muted text-center mb-4">Step 1 of 4 — your details</p>
<form method="POST">
  <div class="mb-3">
    <label class="form-label fw-semibold">Full name</label>
    <input class="form-control" name="full_name" required>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label fw-semibold">Phone</label>
      <input class="form-control" name="phone" placeholder="07xx xxx xxx">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label fw-semibold">Password</label>
    <input type="password" class="form-control" name="password" required minlength="6">
  </div>
  <hr>
  <p class="small text-muted mb-2">Parent / guardian (optional, recommended)</p>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label fw-semibold">Guardian name</label>
      <input class="form-control" name="guardian_name">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label fw-semibold">Guardian phone</label>
      <input class="form-control" name="guardian_phone">
    </div>
  </div>
  <button class="btn btn-brand w-100 py-2" type="submit">Continue <i class="bi bi-arrow-right"></i></button>
</form>
<p class="text-center text-muted mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
