<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}TutorAI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
<style>
  body { background: var(--bg); font-family:'Inter',sans-serif; }
  .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 2rem 1rem; }
  .auth-card { max-width: 480px; width:100%; background:#fff; border-radius:18px; padding:2.2rem 2rem; box-shadow:0 10px 40px rgba(15,23,42,.08); border:1px solid var(--border); }
  .auth-card.wide { max-width: 720px; }
  .auth-logo { display:flex; align-items:center; gap:.6rem; font-weight:800; font-size:1.3rem; color:var(--primary); margin-bottom:1.5rem; justify-content:center; }
  .auth-logo .logo-badge { width:36px; height:36px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .step-dots { display:flex; gap:.4rem; justify-content:center; margin-bottom:1.5rem; }
  .step-dots span { width:8px; height:8px; border-radius:50%; background:var(--border); }
  .step-dots span.active { background:var(--accent); width:22px; border-radius:5px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card {% block card_size %}{% endblock %}">
    <div class="auth-logo"><div class="logo-badge">T</div> TutorAI</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category=='danger' else category }} alert-dismissible fade show py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
